<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#1a1a6e;--primary:#3730a3;--accent:#7c3aed;
  --gold:#fbbf24;--green:#10b981;--red:#ef4444;
  --text:#f1f5f9;--card:#ffffff12;--radius:16px
}
body{
  background:var(--bg);color:var(--text);
  font-family:'Arial Hebrew','David',Arial,sans-serif;
  min-height:100vh;overflow-x:hidden;
  -webkit-tap-highlight-color:transparent;
  direction:rtl;
}
#app{max-width:640px;margin:0 auto;padding:0 0 100px}
button{cursor:pointer;border:none;background:none;font-family:inherit;color:inherit;direction:rtl}
/* ======= HOME SCREEN ======= */
.home{padding:16px}
.home-header{text-align:center;padding:20px 0 16px}
.home-title{font-size:2rem;font-weight:bold;text-shadow:0 2px 8px rgba(0,0,0,0.4)}
.stats-bar{
  display:flex;justify-content:center;gap:24px;
  background:var(--card);border-radius:var(--radius);
  padding:10px 20px;margin:12px 0;font-size:1.1rem
}
.level-toggle{display:flex;gap:8px;justify-content:center;margin:12px 0}
.level-btn{
  padding:10px 20px;border-radius:32px;font-size:1rem;font-weight:bold;
  transition:all 0.2s;border:2px solid transparent
}
.level-btn.active{background:var(--gold);color:#1a1a6e;border-color:var(--gold)}
.level-btn:not(.active){background:var(--card);color:var(--text);border-color:#ffffff22}
.quick-btns{display:flex;gap:10px;margin:12px 0}
.quick-btn{
  flex:1;padding:12px;border-radius:var(--radius);
  background:var(--card);font-size:1rem;text-align:center;
  border:1px solid #ffffff22;transition:all 0.15s
}
.quick-btn:active{transform:scale(0.96);background:#ffffff22}
.units-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.unit-card{
  background:var(--card);border-radius:var(--radius);
  padding:14px;border:1px solid #ffffff22;
  transition:all 0.15s;position:relative;overflow:hidden;cursor:pointer
}
.unit-card:active{transform:scale(0.97);background:#ffffff22}
.unit-card.done{border-color:var(--green)}
.unit-emoji{font-size:2rem;display:block;margin-bottom:4px}
.unit-title{font-size:0.9rem;font-weight:bold;line-height:1.3}
.unit-stars{color:var(--gold);font-size:0.85rem;margin:4px 0}
.unit-progress{height:4px;background:#ffffff22;border-radius:4px;margin-top:6px;overflow:hidden}
.unit-progress-fill{height:100%;background:var(--green);border-radius:4px;transition:width 0.4s}
.badges-btn{
  width:100%;padding:14px;border-radius:var(--radius);
  background:linear-gradient(135deg,#7c3aed,#3730a3);
  font-size:1.1rem;font-weight:bold;margin:8px 0;
  border:1px solid #ffffff22
}
.reset-btn{
  display:block;margin:8px auto;padding:8px 16px;
  border-radius:32px;background:transparent;
  font-size:0.8rem;color:#ffffff66;border:1px solid #ffffff22
}
/* ======= UNIT SCREEN ======= */
.unit-screen{padding:16px}
.back-btn{
  display:flex;align-items:center;gap:8px;
  padding:8px;border-radius:12px;font-size:1rem;
  margin-bottom:12px;background:var(--card);width:fit-content
}
.unit-header{text-align:center;margin-bottom:16px}
.unit-header-title{font-size:1.4rem;font-weight:bold}
.tab-bar{
  display:flex;background:var(--card);
  border-radius:32px;padding:4px;margin-bottom:16px
}
.tab-btn{
  flex:1;padding:10px;border-radius:28px;
  font-size:0.95rem;text-align:center;transition:all 0.2s
}
.tab-btn.active{background:var(--accent);font-weight:bold}
/* ======= LEARN TAB ======= */
.flashcard-wrap{position:relative;min-height:300px}
.flashcard{
  background:var(--card);border-radius:24px;
  padding:32px 20px;text-align:center;
  border:1px solid #ffffff22;animation:fadeIn 0.3s ease
}
.letter-big{
  font-size:5rem;line-height:1.6;
  font-family:'Arial Hebrew','David',Arial,serif;
  direction:rtl;display:block
}
.letter-name{font-size:1.2rem;color:var(--gold);margin-bottom:8px}
.letter-example{font-size:1.4rem;margin:8px 0;direction:rtl}
.example-emoji{font-size:2rem;margin-bottom:8px;display:block}
.tts-btn{
  background:var(--accent);border-radius:32px;
  padding:12px 28px;font-size:1rem;font-weight:bold;
  margin:12px auto;display:block;transition:all 0.15s
}
.tts-btn:active{transform:scale(0.95)}
.card-nav{
  display:flex;justify-content:center;align-items:center;
  gap:16px;margin-top:16px
}
.nav-btn{
  background:var(--card);border-radius:50%;
  width:44px;height:44px;font-size:1.4rem;
  display:flex;align-items:center;justify-content:center;
  border:1px solid #ffffff33
}
.nav-btn:disabled{opacity:0.3}
.card-dots{display:flex;gap:6px}
.dot{
  width:8px;height:8px;border-radius:50%;
  background:#ffffff33;transition:all 0.2s
}
.dot.active{background:var(--gold);transform:scale(1.3)}
.swallowed-note{
  background:#92400e44;border:1px solid #f59e0b;
  border-radius:12px;padding:10px;font-size:0.9rem;
  margin-top:12px;color:#fde68a
}
.double-sound-btns{display:flex;gap:12px;margin:12px 0}
.sound-btn{
  flex:1;padding:14px;border-radius:14px;
  font-size:1rem;font-weight:bold;text-align:center;
  border:2px solid;transition:all 0.15s;cursor:pointer
}
.sound-open{border-color:var(--gold);background:rgba(251,191,36,0.1)}
.sound-closed{border-color:#60a5fa;background:rgba(96,165,250,0.1)}
.sound-btn:active{transform:scale(0.97)}
.sound-example{font-size:1.1rem;margin-top:6px;direction:rtl}
.swallowed-badge{
  display:inline-block;background:#92400e;
  border-radius:8px;padding:2px 8px;font-size:0.8rem;
  margin-right:6px
}
/* ======= MATCH/QUIZ ======= */
.question-box{
  background:var(--card);border-radius:24px;
  padding:24px 16px;text-align:center;margin-bottom:16px;
  border:1px solid #ffffff22;animation:fadeIn 0.3s ease
}
.question-prompt{font-size:1.1rem;color:var(--gold);margin-bottom:16px}
.question-word{font-size:2.5rem;direction:rtl;margin-bottom:8px;line-height:1.6}
.tts-mini-btn{
  background:var(--accent);border-radius:32px;
  padding:8px 20px;font-size:0.9rem;margin-bottom:12px;
  display:inline-block
}
.options-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0
}
.option-btn{
  padding:16px 8px;border-radius:14px;
  background:var(--card);border:2px solid #ffffff22;
  font-size:1.3rem;font-weight:bold;direction:rtl;
  transition:all 0.15s;line-height:1.6;cursor:pointer
}
.option-btn:active:not(:disabled){transform:scale(0.96)}
.option-btn.correct{background:#065f4644;border-color:var(--green);color:var(--green)}
.option-btn.wrong{background:#7f1d1d44;border-color:var(--red);color:var(--red)}
.option-btn:disabled{cursor:default}
.score-box{
  text-align:center;background:var(--card);
  border-radius:24px;padding:32px 20px;
  animation:popIn 0.4s ease
}
.score-stars{font-size:2.5rem;margin:12px 0}
.score-text{font-size:1.3rem;margin-bottom:20px}
.score-btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.action-btn{
  padding:12px 24px;border-radius:32px;
  font-size:1rem;font-weight:bold;
  background:var(--accent);transition:all 0.15s
}
.action-btn:active{transform:scale(0.96)}
.action-btn.secondary{background:var(--card);border:1px solid #ffffff33}
/* ======= ALPHABET SCREEN ======= */
.alphabet-screen{padding:16px}
.screen-title{font-size:1.4rem;font-weight:bold;text-align:center;margin-bottom:16px}
.alpha-grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:10px
}
.alpha-card{
  background:var(--card);border-radius:14px;
  padding:12px 8px;text-align:center;
  border:1px solid #ffffff22;cursor:pointer;
  transition:all 0.15s;position:relative
}
.alpha-card:active{transform:scale(0.96);background:#ffffff22}
.alpha-card.swallowed{border-color:#f59e0b}
.alpha-card.double{border-color:#a78bfa}
.alpha-letter{font-size:2.8rem;display:block;line-height:1.4;direction:rtl}
.alpha-name{font-size:0.75rem;color:var(--gold);margin-bottom:2px}
.alpha-example{font-size:0.8rem;color:#cbd5e1;direction:rtl}
.alpha-badges{display:flex;gap:4px;justify-content:center;margin-top:4px}
.mini-badge{font-size:0.75rem;background:#ffffff22;border-radius:6px;padding:1px 5px}
/* ======= NIKUD SCREEN ======= */
.nikud-grid{
  display:grid;grid-template-columns:repeat(2,1fr);gap:12px
}
.nikud-card{
  background:var(--card);border-radius:16px;
  padding:16px;text-align:center;cursor:pointer;
  border:1px solid #ffffff22;transition:all 0.15s
}
.nikud-card:active{transform:scale(0.96)}
.nikud-display{font-size:3rem;display:block;line-height:1.8;direction:rtl}
.nikud-name{font-size:0.85rem;color:var(--gold);margin-bottom:4px}
.nikud-desc{font-size:0.8rem;color:#94a3b8}
.nikud-example{font-size:1.1rem;margin-top:6px;direction:rtl}
/* ======= BADGES SCREEN ======= */
.badges-grid{
  display:grid;grid-template-columns:repeat(2,1fr);gap:12px;
  padding:16px
}
.badge-card{
  background:var(--card);border-radius:16px;
  padding:16px;text-align:center;
  border:1px solid #ffffff22
}
.badge-card.unlocked{border-color:var(--gold);background:#fbbf2415}
.badge-card.locked{opacity:0.5}
.badge-emoji{font-size:2.5rem;display:block;margin-bottom:8px}
.badge-name{font-size:0.95rem;font-weight:bold;margin-bottom:4px}
.badge-cond{font-size:0.8rem;color:#94a3b8}
/* ======= STORY ======= */
.story-text{
  background:var(--card);border-radius:20px;
  padding:20px;font-size:1.2rem;line-height:2.2;
  direction:rtl;margin-bottom:16px;
  border:1px solid #ffffff22
}
.story-title{font-size:1.1rem;font-weight:bold;color:var(--gold);margin-bottom:12px;text-align:center}
.story-q-label{font-size:1rem;color:var(--gold);text-align:center;margin:8px 0 4px}
/* ======= MASCOT ======= */
.mascot{
  position:fixed;bottom:16px;left:16px;
  font-size:3rem;z-index:100;transition:all 0.3s;
  pointer-events:none
}
.mascot-idle{animation:mascotIdle 2s ease-in-out infinite}
.mascot-correct{animation:mascotJump 0.8s ease}
.mascot-wrong{animation:mascotShake 0.6s ease}
.mascot-streak{animation:mascotSpin 1.2s ease}
.mascot-celebrate{animation:mascotDance 2s ease;font-size:4rem}
/* ======= TOAST ======= */
.badge-toast{
  position:fixed;top:20px;right:50%;transform:translateX(50%);
  background:var(--gold);color:#1a1a6e;
  border-radius:16px;padding:16px 24px;text-align:center;
  z-index:1000;animation:popIn 0.4s ease
}
/* ======= PROGRESS BAR ======= */
.progress-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:8px;font-size:0.9rem;color:#94a3b8
}
/* ======= SYLLABLE BTNS ======= */
.syllable-open-btn{background:#d1fae5;color:#065f46;border:2px solid #10b981}
.syllable-closed-btn{background:#dbeafe;color:#1e40af;border:2px solid #3b82f6}
/* ======= DOUBLE SOUND LEARN ======= */
.double-sound-card{border-radius:16px;padding:14px;text-align:center;margin:8px 0}
/* ======= MISC ======= */
.done-check{position:absolute;top:6px;left:6px;font-size:1rem;color:var(--green)}
.section-label{font-size:0.85rem;color:#94a3b8;margin:8px 0 4px;text-align:center}
/* ======= KEYFRAMES ======= */
@keyframes fall{from{top:-20px;opacity:1}to{top:105vh;opacity:0}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes popIn{from{transform:translateX(50%) scale(0.5);opacity:0}to{transform:translateX(50%) scale(1);opacity:1}}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes coinFly{from{transform:translateY(0);opacity:1}to{transform:translateY(-80px) translateX(200px);opacity:0}}
@keyframes mascotIdle{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes mascotJump{0%,100%{transform:translateY(0)}40%{transform:translateY(-30px)}}
@keyframes mascotShake{0%,100%{transform:rotate(0)}25%{transform:rotate(-15deg)}75%{transform:rotate(15deg)}}
@keyframes mascotSpin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes mascotDance{0%,100%{transform:scale(1) rotate(0)}25%{transform:scale(1.3) rotate(-10deg)}75%{transform:scale(1.3) rotate(10deg)}}
/* Theme overrides */
body.theme-beginner{--bg:#0f4c2a;--primary:#166534;--accent:#16a34a}
body.theme-advanced{--bg:#1e1b4b;--primary:#3730a3;--accent:#7c3aed}
</style>

<script>
// ===== AUDIO SYSTEM =====
let audioCtx = null;
function initAudio() {
  if (audioCtx) return;
  try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
}
document.addEventListener('click', initAudio, {once:true});
document.addEventListener('touchstart', initAudio, {once:true, passive:true});

function playTone(freq, duration, type='sine', volume=0.3) {
  if (!audioCtx) return;
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.frequency.value = freq; osc.type = type;
    gain.gain.setValueAtTime(volume, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.start(); osc.stop(audioCtx.currentTime + duration);
  } catch(e) {}
}

const SFX = {
  tap:     () => playTone(440, 0.08, 'sine', 0.15),
  correct: () => { playTone(523,0.12); setTimeout(()=>playTone(659,0.12),130); setTimeout(()=>playTone(784,0.25),260); },
  wrong:   () => playTone(180, 0.4, 'sawtooth', 0.2),
  coin:    () => { playTone(880,0.05); setTimeout(()=>playTone(1320,0.15),60); },
  streak:  () => [659,784,880,1047].forEach((f,i)=>setTimeout(()=>playTone(f,0.15),i*100)),
  fanfare: () => [523,587,659,698,784].forEach((f,i)=>setTimeout(()=>playTone(f,0.2),i*120)),
  swallow: () => playTone(220, 0.5, 'triangle', 0.12),
  open:    () => { playTone(440,0.2); setTimeout(()=>playTone(660,0.3),200); },
  closed:  () => { playTone(660,0.2); setTimeout(()=>playTone(440,0.3),200); },
};

// ===== TTS =====
function sayHe(text, rate=0.75, pitch=1.1) {
  if (!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang='he-IL'; u.rate=rate; u.pitch=pitch; u.volume=1;
  speechSynthesis.speak(u);
}

function praiseRandom() { sayHe(PRAISE[Math.floor(Math.random()*PRAISE.length)], 0.85, 1.3); }
function encourageRandom() { sayHe(ENCOURAGE[Math.floor(Math.random()*ENCOURAGE.length)], 0.8); }

// ===== PROGRESS =====
function defaultProgress() {
  return { version:1, coins:0, currentStreak:0, maxStreak:0, badges:[], mascot:'fox', units:{} };
}
function loadProgress() {
  try {
    const d = JSON.parse(localStorage.getItem('hebrewReadingApp_v1') || 'null');
    return (d && d.version === 1) ? d : defaultProgress();
  } catch { return defaultProgress(); }
}
function saveProgress() {
  try { localStorage.setItem('hebrewReadingApp_v1', JSON.stringify(state.progress)); } catch {}
}
function getUnitProg(id) {
  if (!state.progress.units[id]) {
    state.progress.units[id] = {
      stars: 0,
      activities: { learn: false, match: {done:false, score:0}, quiz: {done:false, score:0} }
    };
  }
  return state.progress.units[id];
}
function calcUnitProgress(id) {
  const u = state.progress.units[id];
  if (!u) return 0;
  let n = 0;
  if (u.activities.learn) n++;
  if (u.activities.match && u.activities.match.done) n++;
  if (u.activities.quiz && u.activities.quiz.done) n++;
  return n;
}
function calcStars(score, total) {
  const pct = score / total;
  if (pct >= 0.9) return 3;
  if (pct >= 0.6) return 2;
  if (pct > 0) return 1;
  return 0;
}

// ===== MASCOT =====
const MASCOTS = { fox:'🦊', lion:'🦁', frog:'🐸' };
function setMascot(newState) {
  state.mascotState = newState;
  const el = document.getElementById('mascot');
  if (!el) return;
  el.className = 'mascot mascot-' + newState;
  el.textContent = MASCOTS[state.progress.mascot] || '🦊';
  if (newState !== 'idle') {
    setTimeout(() => {
      if (state.mascotState === newState) {
        state.mascotState = 'idle';
        el.className = 'mascot mascot-idle';
      }
    }, newState === 'celebrate' ? 2500 : 1200);
  }
}

const BADGE_DEFS = [

  const el = document.createElement('div');

// ===== FEEDBACK ORCHESTRATOR =====
function feedback(type, extra={}) {
  switch (type) {
    case 'correct':
      SFX.correct();
      setTimeout(praiseRandom, 300);
      setMascot('correct');
      spawnCoin();
      state.progress.currentStreak++;
      if (state.progress.currentStreak > state.progress.maxStreak)
        state.progress.maxStreak = state.progress.currentStreak;
      if (state.progress.currentStreak % 5 === 0)
        setTimeout(() => {
          SFX.streak();
          sayHe(`${state.progress.currentStreak} ברצף! אלוף!`, 0.9, 1.4);
          setMascot('streak');
        }, 1200);
      break;
    case 'wrong':
      SFX.wrong();
      setTimeout(() => {
        encourageRandom();
        if (extra.answer) setTimeout(() => sayHe(`זו: ${extra.answer}`), 1200);
      }, 300);
      setMascot('wrong');
      state.progress.currentStreak = 0;
      break;
    case 'unit_complete':
      SFX.fanfare();
      showConfetti();
      setTimeout(() => sayHe(`כל הכבוד! השלמת את היחידה! קיבלת ${extra.stars} כוכבים!`, 0.8, 1.2), 500);
      setMascot('celebrate');
      break;
  }
  saveProgress();
}

  return `

}

function renderMatch(unit) {
  if (unit.type === 'story') return renderStoryQuiz(unit);
  if (state.matchDone) return renderMatchResults(unit);
  if (!state.matchQs || state.matchQs.length === 0) {
    state.matchQs = buildMatchQuestions(unit);
    state.matchQ = 0;
    state.matchScore = 0;
    state.matchAnswered = false;
  }
  if (state.matchQs.length === 0) {
    return '<div class="flashcard" style="text-align:center;padding:40px">אין שאלות לתרגול 😅</div>';
  }

  const q = state.matchQs[state.matchQ];
  if (!q) return renderMatchResults(unit);

  return `
    <div>
      <div class="progress-header">
        <span>שאלה ${state.matchQ + 1} / ${state.matchQs.length}</span>
        <span>✓ ${state.matchScore}</span>

      <div class="question-box">
        <div class="question-prompt">${q.prompt}</div>
        ${q.ttsText ? `<button class="tts-mini-btn" onclick="SFX.tap(); sayHe('${q.ttsText}', 0.7, 1.1)">🔊 שמע</button>` : ''}
        ${q.displayWord ? `<div class="question-word" dir="rtl">${q.displayWord}</div>` : ''}
      </div>
      <div class="options-grid">
        ${q.options.map((opt, i) =>
          `<button class="option-btn" id="match-opt-${i}" onclick="answerMatch(${i})" ${state.matchAnswered?'disabled':''}>${opt}</button>`
        ).join('')}
      </div>
      ${state.matchAnswered ? `
        <div style="text-align:center;margin-top:12px">
          <button class="action-btn" onclick="nextMatch(${state.matchQs.length})">
            ${state.matchQ + 1 < state.matchQs.length ? 'הבא ▶' : 'סיום 🎉'}
          </button>
        </div>
      ` : ''}
    </div>
  `;
}

function buildMatchQuestions(unit) {
  const qs = [];
  if (unit.type === 'double_sound') {
    unit.items.forEach(item => {
      const opts1 = shuffle([item.openExample, item.closedExample, 'שניהם שווים', 'לא יודע']);
      qs.push({
        prompt: `האות ${item.letter} — איזה צליל?`,
        displayWord: item.letter,
        ttsText: item.letter,
        options: opts1,
        correct: opts1.indexOf(item.openExample),
        correctText: item.openExample,
      });
      const opts2 = shuffle(['צליל פותח', 'צליל סוגר', 'שניהם', 'אחר']);
      qs.push({
        prompt: `בְּ"${item.closedExample}" — איזה צליל?`,
        displayWord: item.closedExample,
        ttsText: item.closedExample,
        options: opts2,
        correct: opts2.indexOf('צליל סוגר'),
        correctText: 'צליל סוגר',
      });
    });
  } else if (unit.type === 'swallowed') {
    unit.items.forEach(item => {
      qs.push({
        prompt: `בְּ"${item.example}" — האות ${item.letter} נקראת?`,
        displayWord: item.example,
        ttsText: item.example,
        options: ['כן, נקראת', 'לא, שקטה', 'לפעמים', 'לא יודע'],
        correct: 1,
        correctText: 'לא, שקטה',
      });
      qs.push({
        prompt: `בְּ"${item.normalExample}" — האות ${item.letter} נקראת?`,
        displayWord: item.normalExample,
        ttsText: item.normalExample,
        options: ['כן, נקראת', 'לא, שקטה', 'לפעמים', 'לא יודע'],
        correct: 0,
        correctText: 'כן, נקראת',
      });
    });
  } else {
    unit.items.forEach(item => {
      const display = item.letter || item.display || item.text;
      const ttsText = item.ttsWord || item.sound || display;
      const correctOpt = display;
      const wrong = (item.wrongOptions || []).slice(0, 3);
      const all = shuffle([correctOpt, ...wrong]).slice(0, 4);
      while (all.length < 4) all.push('—');
      qs.push({
        prompt: 'שמע וזהה:',
        ttsText: ttsText,
        options: all,
        correct: all.indexOf(correctOpt),
        correctText: correctOpt,
      });
    });
  }
  return shuffle(qs);
}

function answerMatch(idx) {
  if (state.matchAnswered) return;
  state.matchAnswered = true;
  const q = state.matchQs[state.matchQ];
  const correct = idx === q.correct;

  // Color buttons
  for (let i = 0; i < q.options.length; i++) {
    const btn = document.getElementById('match-opt-' + i);
    if (!btn) continue;
    if (i === q.correct) btn.classList.add('correct');
    else if (i === idx && !correct) btn.classList.add('wrong');
    btn.disabled = true;
  }

  if (correct) {
    state.matchScore++;
    feedback('correct');
  } else {
    feedback('wrong', { answer: q.correctText });
  }

  // Auto-advance after short delay
  setTimeout(() => {
    if (state.matchAnswered) nextMatch(state.matchQs.length);
  }, 1800);
}

function nextMatch(total) {
  state.matchAnswered = false;
  if (state.matchQ + 1 >= total) {
    state.matchDone = true;
    const unit = getUnit(state.unitId);
    const prog = getUnitProg(state.unitId);
    const stars = calcStars(state.matchScore, total);
    prog.activities.match = { done: true, score: state.matchScore };
    if (stars > prog.stars) prog.stars = stars;
    saveProgress();
    checkBadges();
    render();
    return;
  }
  state.matchQ++;
  render();
}

function renderMatchResults(unit) {
  const total = state.matchQs.length;
  const stars = calcStars(state.matchScore, total);
  const starStr = '★'.repeat(stars) + '☆'.repeat(3 - stars);
  const prog = getUnitProg(unit.id);

  return `
    <div class="score-box">
      <div style="font-size:3rem">🎉</div>
      <div class="score-stars">${starStr}</div>
      <div class="score-text">${state.matchScore} / ${total} נכון!</div>
      <div class="score-btns">
        <button class="action-btn secondary" onclick="resetMatch()">שחק שוב 🔄</button>
        <button class="action-btn" onclick="switchTab('quiz')">חידון ⭐</button>
      </div>
    </div>
  `;
}

// ===== RENDER: QUIZ =====
function renderQuiz(unit) {
  if (unit.type === 'story') return renderStoryQuiz(unit);
  if (state.quizDone) return renderQuizResults(unit);
  if (!state.quizQs || state.quizQs.length === 0) {
    state.quizQs = buildQuizQuestions(unit);
    state.quizQ = 0;
    state.quizScore = 0;
    state.quizAnswered = false;
  }
  if (state.quizQs.length === 0) {
    return '<div class="flashcard" style="text-align:center;padding:40px">אין שאלות 😅</div>';
  }

  const q = state.quizQs[state.quizQ];
  if (!q) return renderQuizResults(unit);

  return `
    <div>
      <div class="progress-header">
        <span>שאלה ${state.quizQ + 1} / ${state.quizQs.length}</span>
        <span>✓ ${state.quizScore}</span>
      </div>
      <div class="question-box">
        <div class="question-prompt">${q.prompt}</div>
        ${q.ttsText ? `<button class="tts-mini-btn" onclick="SFX.tap(); sayHe('${q.ttsText}', 0.7, 1.1)">🔊 שמע</button>` : ''}
        ${q.displayWord ? `<div class="question-word" dir="rtl">${q.displayWord}</div>` : ''}
      </div>
      ${unit.type === 'syllables' ?
        `<div class="options-grid">
          <button class="option-btn syllable-open-btn" id="quiz-opt-0" onclick="answerQuiz(0)" ${state.quizAnswered?'disabled':''}>פתוחה 🚪</button>
          <button class="option-btn syllable-closed-btn" id="quiz-opt-1" onclick="answerQuiz(1)" ${state.quizAnswered?'disabled':''}>סגורה 🚪✓</button>
        </div>`
        :
        `<div class="options-grid">
          ${q.options.map((opt, i) =>
            `<button class="option-btn" id="quiz-opt-${i}" onclick="answerQuiz(${i})" ${state.quizAnswered?'disabled':''}>${opt}</button>`
          ).join('')}
        </div>`
      }
      ${state.quizAnswered ? `
        <div style="text-align:center;margin-top:12px">
          <button class="action-btn" onclick="nextQuiz(${state.quizQs.length})">
            ${state.quizQ + 1 < state.quizQs.length ? 'הבא ▶' : 'סיום 🎉'}
          </button>
        </div>
      ` : ''}
    </div>
  `;
}

function buildQuizQuestions(unit) {
  if (unit.type === 'syllables') {
    return unit.items.map(item => ({
      prompt: 'הברה פתוחה או סגורה?',
      displayWord: item.text,
      ttsText: item.ttsWord,
      options: ['פתוחה', 'סגורה'],
      correct: item.syllableType === 'open' ? 0 : 1,
      correctText: item.syllableType === 'open' ? 'פתוחה' : 'סגורה',
    }));
  }
  if (unit.type === 'sentences') {
    return unit.items.map(item => {
      const opts = shuffle([item.text, ...item.wrongOptions]).slice(0, 4);
      return {
        prompt: 'איזה משפט שמעת?',
        ttsText: item.ttsWord,
        options: opts,
        correct: opts.indexOf(item.text),
        correctText: item.text,
      };
    });
  }
  if (unit.type === 'words' || unit.type === 'letters' || unit.type === 'nikud' || unit.type === 'double_sound' || unit.type === 'swallowed') {
    return buildMatchQuestions(unit);
  }
  return buildMatchQuestions(unit);
}

function answerQuiz(idx) {
  if (state.quizAnswered) return;
  state.quizAnswered = true;
  const q = state.quizQs[state.quizQ];
  const unit = getUnit(state.unitId);
  const totalOpts = unit.type === 'syllables' ? 2 : q.options.length;
  const correct = idx === q.correct;

  for (let i = 0; i < totalOpts; i++) {
    const btn = document.getElementById('quiz-opt-' + i);
    if (!btn) continue;
    if (i === q.correct) btn.classList.add('correct');
    else if (i === idx && !correct) btn.classList.add('wrong');
    btn.disabled = true;
  }

  if (correct) {
    state.quizScore++;
    feedback('correct');
  } else {
    feedback('wrong', { answer: q.correctText });
  }

  setTimeout(() => {
    if (state.quizAnswered) nextQuiz(state.quizQs.length);
  }, 1800);
}

function nextQuiz(total) {
  state.quizAnswered = false;
  if (state.quizQ + 1 >= total) {
    state.quizDone = true;
    const prog = getUnitProg(state.unitId);
    const stars = calcStars(state.quizScore, total);
    prog.activities.quiz = { done: true, score: state.quizScore };
    if (stars > prog.stars) prog.stars = stars;
    if (!prog.activities.learn) prog.activities.learn = true;
    saveProgress();
    checkBadges();
    feedback('unit_complete', { stars });
    render();
    return;
  }
  state.quizQ++;
  render();
}

function renderQuizResults(unit) {
  const total = state.quizQs.length || 1;
  const stars = calcStars(state.quizScore, total);
  const starStr = '★'.repeat(stars) + '☆'.repeat(3 - stars);

  return `
    <div class="score-box">
      <div style="font-size:3rem">🏆</div>
      <div class="score-stars">${starStr}</div>
      <div class="score-text">${state.quizScore} / ${total} נכון!</div>
      <div class="score-btns">
        <button class="action-btn secondary" onclick="resetQuiz()">שחק שוב 🔄</button>
        <button class="action-btn" onclick="goScreen('home')">בית 🏠</button>
      </div>
    </div>
  `;
}

// Story quiz (special flow)
function renderStoryQuiz(unit) {
  const story = unit.story;
  if (state.storyDone) {
    const stars = calcStars(state.storyScore, story.questions.length);
    const starStr = '★'.repeat(stars) + '☆'.repeat(3-stars);
    return `
      <div class="score-box">
        <div style="font-size:3rem">📖</div>
        <div class="score-stars">${starStr}</div>
        <div class="score-text">${state.storyScore} / ${story.questions.length} נכון!</div>
        <div class="score-btns">
          <button class="action-btn secondary" onclick="resetStory()">שוב 🔄</button>
          <button class="action-btn" onclick="goScreen('home')">בית 🏠</button>
        </div>
      </div>`;
  }
  if (state.storyQ === -1) {
    return `
      <div>
        <div class="story-text">
          <div class="story-title">${story.title}</div>
          <div dir="rtl">${story.text}</div>
        </div>
        <button class="tts-btn" style="width:100%;margin-bottom:12px" onclick="SFX.tap(); sayHe('${story.text}', 0.65, 1.1)">🔊 שמע</button>
        <button class="action-btn" style="width:100%;display:block;text-align:center" onclick="startStoryQ()">▶ שאלות הבנה</button>
      </div>`;
  }
  const q = story.questions[state.storyQ];
  return `
    <div>
      <div class="progress-header">
        <span>שאלה ${state.storyQ+1} / ${story.questions.length}</span>
        <span>✓ ${state.storyScore}</span>
      </div>
      <div class="question-box">
        <div class="question-prompt">${q.q}</div>
      </div>
      <div class="options-grid">
        ${q.opts.map((opt, i) =>
          `<button class="option-btn" id="story-opt-${i}" onclick="answerStory(${i})" ${state.quizAnswered?'disabled':''}>${opt}</button>`
        ).join('')}
      </div>
      ${state.quizAnswered ? `
        <div style="text-align:center;margin-top:12px">
          <button class="action-btn" onclick="nextStory(${story.questions.length})">
            ${state.storyQ+1 < story.questions.length ? 'הבא ▶' : 'סיום 🎉'}
          </button>
        </div>
      ` : ''}
    </div>`;
}

function startStoryQ() {
  state.storyQ = 0;
  state.quizAnswered = false;
  render();
}
function answerStory(idx) {
  if (state.quizAnswered) return;
  state.quizAnswered = true;
  const unit = getUnit(state.unitId);
  const q = unit.story.questions[state.storyQ];
  const correct = idx === q.correct;
  for (let i = 0; i < q.opts.length; i++) {
    const btn = document.getElementById('story-opt-' + i);
    if (!btn) continue;
    if (i === q.correct) btn.classList.add('correct');
    else if (i === idx && !correct) btn.classList.add('wrong');
    btn.disabled = true;
  }
  if (correct) { state.storyScore++; feedback('correct'); }
  else feedback('wrong', { answer: q.opts[q.correct] });
  setTimeout(() => { if (state.quizAnswered) nextStory(unit.story.questions.length); }, 1800);
}
function nextStory(total) {
  state.quizAnswered = false;
  if (state.storyQ + 1 >= total) {
    state.storyDone = true;
    const prog = getUnitProg(state.unitId);
    const stars = calcStars(state.storyScore, total);
    prog.activities.quiz = { done: true, score: state.storyScore };
    if (stars > prog.stars) prog.stars = stars;
    prog.activities.learn = true;
    saveProgress();
    checkBadges();
    feedback('unit_complete', { stars });
    render();
    return;
  }
  state.storyQ++;
  render();
}
function resetStory() {
  state.storyQ = -1;
  state.storyScore = 0;
  state.storyDone = false;
  state.quizAnswered = false;
  render();
}

// ===== NAVIGATION =====
function goScreen(screen) {
  SFX.tap();
  state.screen = screen;
  if (screen === 'home') {
    state.unitId = null;
    document.body.className = state.level === 'beginner' ? 'theme-beginner' : 'theme-advanced';
  }
  render();
  window.scrollTo(0, 0);
}

function openUnit(id) {
  SFX.open();
  state.unitId = id;
  state.screen = 'unit';
  state.tab = 'learn';
  state.cardIndex = 0;
  state.matchQs = [];
  state.matchQ = 0;
  state.matchScore = 0;
  state.matchAnswered = false;
  state.matchDone = false;
  state.quizQs = [];
  state.quizQ = 0;
  state.quizScore = 0;
  state.quizAnswered = false;
  state.quizDone = false;
  state.storyQ = -1;
  state.storyScore = 0;
  state.storyDone = false;

  // Mark learn started + auto-TTS
  const unit = getUnit(id);
  render();
  if (unit && unit.type !== 'story') {
    setTimeout(() => {
      const item = unit.items[0];
      if (item) {
        const ttsText = item.ttsWord || item.sound || item.name || item.letter || item.text;
        sayHe(ttsText, 0.7, 1.1);
      }
    }, 600);
  }

  const prog = getUnitProg(id);
  if (!prog.activities.learn) {
    prog.activities.learn = true;
    saveProgress();
  }
  window.scrollTo(0, 0);
}

function switchTab(tab) {
  SFX.tap();
  state.tab = tab;
  if (tab === 'learn') { state.cardIndex = 0; }
  if (tab === 'match') {
    state.matchQs = [];
    state.matchDone = false;
    state.matchAnswered = false;
    state.matchQ = 0;
    state.matchScore = 0;
  }
  if (tab === 'quiz') {
    state.quizQs = [];
    state.quizDone = false;
    state.quizAnswered = false;
    state.quizQ = 0;
    state.quizScore = 0;
  }
  render();
}

function prevCard() {
  SFX.tap();
  if (state.cardIndex > 0) {
    state.cardIndex--;
    render();
    const unit = getUnit(state.unitId);
    if (unit) {
      const item = unit.items[state.cardIndex];
      if (item) setTimeout(() => sayHe(item.ttsWord || item.sound || item.name || item.letter || '', 0.7, 1.1), 300);
    }
  }
}

function nextCard(total) {
  SFX.tap();
  if (state.cardIndex < total - 1) {
    state.cardIndex++;
    render();
    const unit = getUnit(state.unitId);
    if (unit) {
      const item = unit.items[state.cardIndex];
      if (item) setTimeout(() => sayHe(item.ttsWord || item.sound || item.name || item.letter || '', 0.7, 1.1), 300);
    }
  }
}

function setLevel(level) {
  SFX.tap();
  state.level = level;
  document.body.className = level === 'beginner' ? 'theme-beginner' : 'theme-advanced';
  render();
}

function resetMatch() {
  state.matchQs = [];
  state.matchDone = false;
  state.matchAnswered = false;
  state.matchQ = 0;
  state.matchScore = 0;
  render();
}

function resetQuiz() {
  state.quizQs = [];
  state.quizDone = false;
  state.quizAnswered = false;
  state.quizQ = 0;
  state.quizScore = 0;
  render();
}

function confirmReset() {
  const modal = document.createElement('div');
  modal.style.cssText = 'position:fixed;inset:0;background:#000a;z-index:999;display:flex;align-items:center;justify-content:center';
  modal.innerHTML = `<div style="background:#1e1b4b;border-radius:20px;padding:28px 24px;text-align:center;max-width:320px;margin:16px;border:1px solid #ffffff33">
    <div style="font-size:2rem;margin-bottom:12px">🗑️</div>
    <div style="font-size:1.1rem;margin-bottom:20px">האם אתה בטוח?<br>כל ההתקדמות תימחק!</div>
    <div style="display:flex;gap:12px;justify-content:center">
      <button onclick="this.closest('div[style]').remove()" style="padding:10px 20px;border-radius:32px;background:#ffffff22;border:1px solid #ffffff33;color:#fff;font-size:1rem;cursor:pointer">ביטול</button>
      <button id="confirm-reset-ok" style="padding:10px 20px;border-radius:32px;background:#ef4444;border:none;color:#fff;font-size:1rem;font-weight:bold;cursor:pointer">אפס</button>
    </div>
  </div>`;
  document.body.appendChild(modal);
  document.getElementById('confirm-reset-ok').onclick = () => {
    modal.remove();
    state.progress = defaultProgress();
    saveProgress();
    SFX.tap();
    render();
    sayHe('ההתקדמות אופסה. בהצלחה!', 0.8, 1.1);
  };
}

// ===== HELPERS =====
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ===== RENDER =====
function render() {
  const app = document.getElementById('app');
  let html = '';
  switch (state.screen) {
    case 'home':    html = renderHome(); break;
    case 'unit':    html = renderUnit(); break;
    case 'alphabet': html = renderAlphabet(); break;
    case 'nikud':   html = renderNikud(); break;
    case 'badges':  html = renderBadges(); break;
    default:        html = renderHome();
  }
  app.innerHTML = html;

  // Update mascot
  const mascotEl = document.getElementById('mascot');
  if (mascotEl) mascotEl.textContent = MASCOTS[state.progress.mascot] || '🦊';
}

// ===== INIT =====
state.progress = loadProgress();
document.body.className = 'theme-beginner';
render();

document.addEventListener('touchstart', () => {
  initAudio();
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();

  sayHe('שלום! ברוכים הבאים לקוראים ביחד!', 0.8, 1.2);
}, 800);

// ===== PWA: Inline Service Worker =====
(function() {
  if (!('serviceWorker' in navigator)) return;
  const appUrl = location.href.split('?')[0];
  const swCode = [
    "const APP_URL='" + appUrl + "';",
    "self.addEventListener('install',e=>{e.waitUntil(caches.open('app-v1').then(c=>c.add(APP_URL)));self.skipWaiting();});",
    "self.addEventListener('activate',e=>{e.waitUntil(clients.claim());});",
    "self.addEventListener('fetch',e=>{e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request)));});",
  ].join('\n');
  const blob = new Blob([swCode], {type:'text/javascript'});
  const url = URL.createObjectURL(blob);
  navigator.serviceWorker.register(url).catch(()=>{});
})();
